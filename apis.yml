aid: json-binding
name: JSON Binding
description: >-
  JSON Binding (JSON-B) is a standard binding layer for converting Java objects
  to/from JSON messages. It defines a default mapping algorithm for converting
  existing Java classes to JSON, while enabling developers to customize the
  mapping process through a Java API.
